<script>
    // Simple micro-interaction for payment method selection visual feedback
    document.querySelectorAll('input[name="payment"], input[name="shipping"]').forEach(input => {
      input.addEventListener('change', (e) => {
        const parent = e.target.closest('label');
        const siblingLabels = e.target.name === 'payment' 
          ? document.querySelectorAll('input[name="payment"]') 
          : document.querySelectorAll('input[name="shipping"]');
        
        siblingLabels.forEach(s => {
          const sLabel = s.closest('label');
          sLabel.classList.remove('border-2', 'border-primary', 'bg-primary-container/10');
          sLabel.classList.add('border', 'border-outline-variant');
        });

        parent.classList.add('border-2', 'border-primary', 'bg-primary-container/10');
        parent.classList.remove('border', 'border-outline-variant');
      });
    });
  </script>
